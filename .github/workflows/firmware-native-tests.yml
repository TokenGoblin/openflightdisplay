name: firmware-native-tests

on:
  push:
    paths:
      - "firmware/core2/**"
      - ".github/workflows/firmware-native-tests.yml"
  pull_request:
    paths:
      - "firmware/core2/**"
      - ".github/workflows/firmware-native-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade platformio
      # Only the hardware-independent domain/ logic is exercised here --
      # no ESP32 board required. The `core2` build target (real hardware)
      # is intentionally not built in CI; see docs/TEST_PLAN.md's manual
      # hardware-validation checklist for that.
      - name: Run native domain-logic tests
        working-directory: firmware/core2
        run: pio test -e native
