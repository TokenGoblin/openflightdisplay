; PlatformIO project for the OpenFlightDisplay Core2 firmware.
; See docs/CORE2_HARDWARE.md and docs/TEST_PLAN.md.

[platformio]
default_envs = core2

[env:core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -Wl,-u,_printf_float
lib_deps =
    m5stack/M5Unified @ ^0.1.15
    bblanchon/ArduinoJson @ ^6.21.5
    links2004/WebSockets @ ^2.4.1
    ESP32Async/ESPAsyncWebServer @ ^3.1.0
    ESP32Async/AsyncTCP @ ^3.2.5
    ricmoo/QRCode @ ^0.0.1

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Iinclude
    -DUNITY_INCLUDE_DOUBLE
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
test_filter = native/*
test_build_src = yes
build_src_filter = +<domain/*.cpp> -<app/> -<main.cpp>