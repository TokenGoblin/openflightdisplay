; PlatformIO project for the OpenFlightDisplay Core2 firmware.
; See docs/CORE2_HARDWARE.md and docs/TEST_PLAN.md.
;
; Two environments:
;   - `core2`  : the real target (M5Stack Core2 / ESP32, Arduino framework)
;   - `native` : hardware-independent domain-logic tests, compiled with the
;                host's own GCC/Clang -- no ESP32/PlatformIO board required.
;                This is the one that was actually exercisable in the
;                session that wrote this firmware (no PlatformIO install in
;                that sandbox -- see docs/TEST_PLAN.md for what's verified).

[platformio]
default_envs = core2

[env:core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    m5stack/M5Unified @ ^0.1.15
    bblanchon/ArduinoJson @ ^6.21.5
    links2004/WebSockets @ ^2.4.1
    ESP32Async/ESPAsyncWebServer @ ^3.1.0
    ESP32Async/AsyncTCP @ ^3.2.5
    ricmoo/QRCode @ ^0.0.1
    ; Library names/versions above are believed current as of this
    ; writing but were not installed/verified in this session (no
    ; PlatformIO available in the sandbox) -- confirm against the
    ; PlatformIO registry before your first real build, and update this
    ; comment once confirmed.

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
test_filter = native/*
; Only compile the hardware-independent domain/ sources for native tests --
; src/app/ depends on Arduino/ESP32-only headers (M5Unified, WiFi, LittleFS,
; ...) that don't exist for the host `native` platform. PlatformIO already
; excludes src/main.cpp from test builds automatically.
build_src_filter = +<*> -<app/>
