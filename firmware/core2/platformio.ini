; PlatformIO project for the OpenFlightDisplay Core2 firmware.
; See docs/CORE2_HARDWARE.md and docs/TEST_PLAN.md.
;
; Two environments:
;   - `core2`  : the real target (M5Stack Core2 / ESP32, Arduino framework)
;   - `native` : hardware-independent domain-logic tests, compiled with the
;                host's own GCC/Clang -- no ESP32/PlatformIO board required.
;                This is the one that was actually exercisable in the
;                session that wrote this firmware (no PlatformIO install in
;                that sandbox -- see docs/TEST_PLAN.md for what's verified).

[platformio]
default_envs = core2

[env:core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    ; Insurance against a known ESP32/newlib-nano gotcha where %f in
    ; printf-style calls silently produces garbage unless this symbol is
    ; pulled into the link. display.cpp uses %f/%.0f formatting
    ; (Display::renderSingleAircraft); harmless to include even if the
    ; specific toolchain build already has float formatting enabled.
    -Wl,-u,_printf_float
lib_deps =
    m5stack/M5Unified @ ^0.1.15
    bblanchon/ArduinoJson @ ^6.21.5
    links2004/WebSockets @ ^2.4.1
    ESP32Async/ESPAsyncWebServer @ ^3.1.0
    ESP32Async/AsyncTCP @ ^3.2.5
    ricmoo/QRCode @ ^0.0.1
    ; Library names/versions above are believed current as of this
    ; writing but were not installed/verified in this session (no
    ; PlatformIO available in the sandbox) -- confirm against the
    ; PlatformIO registry before your first real build, and update this
    ; comment once confirmed.

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Iinclude
    ; Unity's TEST_ASSERT_EQUAL_DOUBLE/TEST_ASSERT_DOUBLE_WITHIN are
    ; compiled out entirely unless this is defined -- without it, every
    ; double-precision assertion silently reports "Unity Double Precision
    ; Disabled" as a failure (or, in test_geo, crashed outright with
    ; SIGILL) instead of actually checking the value. Verified needed by
    ; running the suite; doubles are trivially available on a native
    ; x86/x64 host so there's no reason to leave this off here (the real
    ; core2 build doesn't use Unity at all, so this only affects native).
    -DUNITY_INCLUDE_DOUBLE
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
test_filter = native/*
; `pio test` does NOT compile src/ into the test binary by default --
; only test/ and lib/ sources. test_build_src is the documented option
; to also pull in src/ (verified needed: without it, linking fails with
; "undefined reference" to every ofd:: domain function).
test_build_src = yes
; Only compile the hardware-independent domain/ sources for native tests --
; src/app/ depends on Arduino/ESP32-only headers (M5Unified, WiFi, LittleFS,
; ...) that don't exist for the host `native` platform, and main.cpp pulls
; in ESPAsyncWebServer.h transitively. (Verified: with test_build_src=yes,
; PlatformIO does NOT automatically exclude main.cpp -- it must be
; excluded explicitly here.)
build_src_filter = +<*> -<app/> -<main.cpp>
