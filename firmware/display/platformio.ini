; PlatformIO project for the OpenFlightDisplay device firmware.
;
; One source tree, two boards. Everything above src/board/ is
; board-agnostic; each environment defines exactly one OFD_BOARD_* flag,
; which selects a board implementation (include/board/board.h), a layout
; profile (include/app/ui_layout.h) and a set of font sizes
; (include/app/ui_theme.h). See docs/CORE2_HARDWARE.md,
; docs/TAB5_HARDWARE.md and docs/DISPLAY_UI.md.
;
; Environments:
;   core2      : M5Stack Core2 (ESP32), USB serial upload.
;   core2-ota  : ditto, over Wi-Fi via espota + mDNS.
;   tab5       : M5Stack Tab5 (ESP32-P4), USB serial upload.
;   tab5-ota   : ditto, over Wi-Fi via espota + mDNS.
;   native     : hardware-independent domain-logic tests, compiled with
;                the host's own GCC/Clang -- no ESP32/PlatformIO board
;                required. Run with `pio test -e native`.
;
; The core2 environment is deliberately left on the mainline espressif32
; platform and its original pinned library versions: it is the
; configuration a physical unit was flashed and validated with
; (docs/CORE2_HARDWARE.md), and adding a second board is not a reason to
; revalidate the first.
;
; Note that the two Espressif platforms do not coexist gracefully in one
; PlatformIO installation -- they collide over the platform name and over
; the shared framework-arduinoespressif32 package, so the first tab5 build
; after a core2 build fails and needs a re-run. This is understood and
; measured, not mysterious: see docs/TAB5_HARDWARE.md's "Two platforms in
; one PlatformIO installation" before changing anything about the
; platform lines below.

[platformio]
default_envs = core2

; ---------------------------------------------------------------------
; Settings every board shares. Board-specific sources are excluded per
; environment rather than included, so a newly added shared file is
; picked up by every board automatically and only a genuinely
; board-specific file needs thinking about.
; ---------------------------------------------------------------------
[common]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -Wl,-u,_printf_float
    -DOTA_PASSWORD='"opendash32"'
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    ESP32Async/ESPAsyncWebServer @ ^3.1.0
    ESP32Async/AsyncTCP @ ^3.2.5
    ricmoo/QRCode @ ^0.0.1

; ---------------------------------------------------------------------
; M5Stack Core2 -- ESP32-D0WDQ6, 320x240, 16MB flash, no PSRAM.
; Hardware-validated end to end; see docs/CORE2_HARDWARE.md.
; ---------------------------------------------------------------------
[env:core2]
; Pinned to an exact version, and that is load-bearing rather than
; tidiness. [env:tab5] installs the pioarduino platform from a Git URL,
; and PlatformIO registers a URL-installed platform under the name in its
; own manifest -- which is also "espressif32". A bare `platform =
; espressif32` here then resolves to whichever of the two was installed
; most recently. Building the Tab5 once silently moved the Core2 onto
; Arduino core 3.3.5 (flash 1,339,069 -> 1,545,247 bytes), i.e. off the
; toolchain a physical unit was validated against, with no error and no
; mention in the build log beyond a PLATFORM: line nobody reads.
; 7.0.1 is the version recorded in docs/CORE2_HARDWARE.md's memory table.
platform = espressif32@7.0.1
board = m5stack-core2
framework = arduino
monitor_speed = ${common.monitor_speed}
; The m5stack-core2 board definition selects default_16MB.csv by
; default, which gives two 6.25MB OTA slots (ota_0 + ota_1) and a
; 3.375MB spiffs partition for LittleFS data -- the same layout
; partitions_16mb_ota.csv spells out explicitly for the Tab5.
build_flags =
    ${common.build_flags}
    -DOFD_BOARD_CORE2
build_src_filter = +<*> -<board/tab5.cpp> -<app/display_flight_tab5.cpp>
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified @ ^0.1.15

[env:core2-ota]
extends = env:core2
upload_protocol = espota
; Upload target -- the device registers its mDNS hostname as its own
; unique device id (src/main.cpp: MDNS.begin(g_ctx.deviceId) /
; ArduinoOTA.setHostname(g_ctx.deviceId)), e.g. "core2-842178.local" --
; deliberately NOT a fixed "openflightdisplay.local", so multiple units
; on one network don't collide. That means there is no single correct
; default here across different physical devices; the placeholder below
; will not resolve on your network. Always override per device with
; either its hostname (read the "DEVICE ID" row on the SYSTEM page, or
; its STATUS screen while pairing) or its IP:
;   pio run -e core2-ota -t upload --upload-port core2-842178.local
;   pio run -e core2-ota -t upload --upload-port 192.168.1.42
upload_port = REPLACE-WITH-DEVICE-ID.local
; OTA password -- read from a local, gitignored file so no real
; password is ever committed. The example file is ota_password.txt
; (one line, plain text). If missing, the build defaults to the
; well-known example password "opendash32" (CHANGE THIS).
extra_scripts =
    pre:ota_inject_password.py
; The extra script exports an OTA_PASSWORD build flag used by
; the C++ code at compile time AND by espota at upload time.

; ---------------------------------------------------------------------
; M5Stack Tab5 -- ESP32-P4, 1280x720 MIPI-DSI, 16MB flash, 32MB PSRAM.
;
; NOT VALIDATED ON HARDWARE. See docs/TAB5_HARDWARE.md for what that
; means in practice and what to check first when flashing a real one.
;
; Three things here are not like the Core2:
;
;  1. Platform. Mainline `espressif32` has no ESP32-P4 support at all, so
;     this uses the pioarduino fork, pinned to an exact release. Pinned,
;     not floating: P4 support is young enough that adjacent releases
;     have broken specific boards, and 55.03.35 is the release the Tab5
;     community settled on to avoid a MIPI-DSI backlight flicker
;     regression. Newer releases may well be fine -- try one deliberately
;     and observe the panel, rather than drifting onto it silently.
;
;  2. Board definition. There is no upstream m5stack-tab5 board file, so
;     this builds against the generic ESP32-P4 evaluation board and
;     overrides what differs: flash size, partition table, and (in
;     src/board/tab5.cpp, which matters far more) the SDIO pins to the
;     Wi-Fi co-processor, which the eval board's defaults get wrong.
;
;  3. Wi-Fi. The P4 has no radio. WiFi.* is forwarded over SDIO to an
;     onboard ESP32-C6 running esp-hosted slave firmware, which M5Stack
;     preloads at the factory. If Wi-Fi never works on a device that is
;     otherwise fine, suspect that firmware -- M5Stack publish a restore
;     procedure -- before suspecting this project.
; ---------------------------------------------------------------------
[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.35
board = esp32-p4-evboard
framework = arduino
monitor_speed = ${common.monitor_speed}
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.partitions = partitions_16mb_ota.csv
board_upload.flash_size = 16MB
upload_speed = 1500000
build_flags =
    ${common.build_flags}
    -DOFD_BOARD_TAB5
    -DBOARD_HAS_PSRAM
    ; The P4 talks to the host over native USB rather than a UART bridge,
    ; so Serial has to be the USB CDC device or every Serial.printf in
    ; the firmware -- including the panel-size mismatch warning in
    ; Display::begin() -- goes nowhere.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<*> -<board/core2.cpp> -<app/display_flight_core2.cpp>
; Tab5 panel support (its display controller varies by production
; revision and M5GFX picks the right one at M5.begin()) landed in
; M5Unified 0.2.17 / M5GFX 0.2.22; anything older will not drive this
; screen.
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified @ ^0.2.17
    m5stack/M5GFX @ ^0.2.22

[env:tab5-ota]
extends = env:tab5
upload_protocol = espota
; Same per-device story as core2-ota above -- override with the device's
; own id or IP:
;   pio run -e tab5-ota -t upload --upload-port tab5-1c40e2.local
upload_port = REPLACE-WITH-DEVICE-ID.local
extra_scripts =
    pre:ota_inject_password.py

; ---------------------------------------------------------------------
; Host-native domain tests. No board, no board layer -- domain/ has
; never depended on either, which is the entire reason these tests can
; run in CI without hardware.
; ---------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Iinclude
    -DUNITY_INCLUDE_DOUBLE
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
test_filter = native/*
test_build_src = yes
; Only compile the hardware-independent domain/ sources -- src/app/ and
; src/board/ depend on Arduino/ESP32-only headers (M5Unified, WiFi,
; LittleFS, ...) that don't exist for the host `native` platform, and
; main.cpp pulls in ESPAsyncWebServer.h transitively.
build_src_filter = +<domain/*.cpp> -<app/> -<board/> -<main.cpp>
